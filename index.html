<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Internship Tracker</title>
  <style>
    :root { color-scheme: light; --ink: #20251f; --muted: #747a70; --line: #e5e8df; --green: #315c43; --paper: #fff; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f6f1; color: var(--ink); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(920px, calc(100% - 40px)); margin: 64px auto; }
    .eyebrow { color: var(--green); font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 8px 0 4px; font-family: Georgia, serif; font-size: clamp(32px, 5vw, 44px); font-weight: 500; letter-spacing: -.035em; }
    .intro { margin: 0; color: var(--muted); }
    .panel { margin-top: 32px; padding: 24px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 8px 24px #28311e08; }
    h2 { margin: 0 0 18px; font-size: 16px; }
    form { display: grid; grid-template-columns: 1.15fr 1.15fr 1fr 1fr auto; align-items: end; gap: 12px; }
    label { display: block; margin-bottom: 6px; color: #5d645a; font-size: 12px; font-weight: 650; }
    input, select { width: 100%; height: 42px; padding: 0 11px; border: 1px solid #dce1d6; border-radius: 7px; background: white; color: var(--ink); font: inherit; font-size: 13px; }
    input:focus, select:focus { border-color: #70917a; outline: 3px solid #70917a22; }
    button { height: 42px; padding: 0 16px; border: 0; border-radius: 7px; background: var(--green); color: white; font: inherit; font-size: 13px; font-weight: 650; cursor: pointer; }
    button:hover { background: #264a35; }
    .list-panel { margin-top: 18px; padding: 0; overflow: hidden; }
    .list-heading { display: flex; align-items: center; justify-content: space-between; padding: 20px 24px; border-bottom: 1px solid var(--line); }
    .list-heading h2 { margin: 0; }
    #count { color: var(--muted); font-size: 12px; }
    .application { display: grid; grid-template-columns: 1.15fr 1.15fr 1fr 1fr; align-items: center; gap: 12px; padding: 17px 24px; border-bottom: 1px solid #edf0e9; }
    .application:last-child { border-bottom: 0; }
    .company { font-weight: 650; }
    .role, .deadline { color: #686f65; font-size: 13px; }
    .status { justify-self: start; padding: 4px 9px; border-radius: 20px; background: #f0f2ec; color: #555e53; font-size: 12px; font-weight: 600; }
    .status[data-status="Applied"] { background: #eaf2eb; color: #315c43; }
    .status[data-status="Interview"] { background: #f8f0dc; color: #886619; }
    .status[data-status="Offer"] { background: #e9eff8; color: #3d5b86; }
    .empty { padding: 42px 20px; color: var(--muted); text-align: center; }
    @media (max-width: 760px) { main { margin: 36px auto; } form { grid-template-columns: 1fr 1fr; } form button { grid-column: span 2; } }
    @media (max-width: 520px) { .panel { padding: 18px; } form { grid-template-columns: 1fr; } form button { grid-column: auto; } .application { grid-template-columns: 1fr 1fr; padding: 15px 18px; } .list-heading { padding: 18px; } }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Your next chapter</div>
    <h1>Internship Tracker</h1>
    <p class="intro">Manage your internship applications, deadlines, and progress in one place.</p>

    <section class="panel" aria-labelledby="form-title">
      <h2 id="form-title">Add an application</h2>
      <form id="application-form">
        <div><label for="company">Company</label><input id="company" name="company" placeholder="e.g. Acme" required></div>
        <div><label for="role">Role</label><input id="role" name="role" placeholder="e.g. Product Intern" required></div>
        <div><label for="deadline">Application deadline</label><input id="deadline" name="deadline" type="date"></div>
        <div><label for="status">Status</label><select id="status" name="status"><option>Interested</option><option>Applied</option><option>Interview</option><option>Offer</option><option>Rejected</option></select></div>
        <button type="submit">Add application</button>
      </form>
    </section>

    <section class="panel list-panel" aria-labelledby="list-title">
      <div class="list-heading"><h2 id="list-title">Applications</h2><span id="count">0 applications</span></div>
      <div id="application-list"><div class="empty">Your applications will appear here.</div></div>
    </section>
  </main>
  <script>
    const form = document.querySelector('#application-form');
    const list = document.querySelector('#application-list');
    const count = document.querySelector('#count');
    const applications = [];
    const dateFormatter = new Intl.DateTimeFormat(undefined, { month: 'short', day: 'numeric', year: 'numeric' });

    function render() {
      count.textContent = `${applications.length} application${applications.length === 1 ? '' : 's'}`;
      if (!applications.length) {
        list.innerHTML = '<div class="empty">Your applications will appear here.</div>';
        return;
      }
      list.replaceChildren(...applications.map(application => {
        const row = document.createElement('div');
        row.className = 'application';
        const company = document.createElement('div');
        company.className = 'company';
        company.textContent = application.company;
        const role = document.createElement('div');
        role.className = 'role';
        role.textContent = application.role;
        const deadline = document.createElement('div');
        deadline.className = 'deadline';
        deadline.textContent = application.deadline ? dateFormatter.format(new Date(`${application.deadline}T00:00:00`)) : 'No deadline';
        const status = document.createElement('span');
        status.className = 'status';
        status.dataset.status = application.status;
        status.textContent = application.status;
        row.append(company, role, deadline, status);
        return row;
      }));
    }

    form.addEventListener('submit', event => {
      event.preventDefault();
      const data = new FormData(form);
      applications.unshift({ company: data.get('company').trim(), role: data.get('role').trim(), deadline: data.get('deadline'), status: data.get('status') });
      render();
      form.reset();
      document.querySelector('#company').focus();
    });
  </script>
</body>
</html>
